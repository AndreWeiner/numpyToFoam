name: numpyToFoamTest

on:
  push:
  pull_request:

jobs:
  integration:
    name: OpenFOAM ${{ matrix.openfoam-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        openfoam-version: [2506, 2512, 2606]

    env:
      OMPI_MCA_rmaps_base_oversubscribe: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up OpenFOAM
        uses: gerlero/setup-openfoam@v1
        with:
          openfoam-version: ${{ matrix.openfoam-version }}

      - name: Install NumPy
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-numpy

      - name: Build function objects and utilities
        run: ./Allwmake

      - name: Run function-object integration tests
        run: ./unittest/Allrun-functionObjects
